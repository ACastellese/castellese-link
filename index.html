
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
<title>Alessandro Castellese | Social</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(145deg, #101820, #263746);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.container { max-width: 420px; width: 100%; }
.logo {
  width: 104px;
  height: 104px;
  margin: 0 auto 25px;
  border: 2px solid #d7b56d;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: bold;
  color: #d7b56d;
}
h1 { font-size: 27px; margin-bottom: 8px; }
.subtitle {
  color: #c4cbd1;
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 35px;
}
.button {
  display: block;
  padding: 18px 20px;
  border-radius: 12px;
  background: #d7b56d;
  color: #101820;
  text-decoration: none;
  font-weight: bold;
  letter-spacing: 1px;
  transition: opacity .2s;
}
.button:active { opacity: .8; }
.note {
  margin-top: 24px;
  color: #c4cbd1;
  font-size: 13px;
  line-height: 1.6;
}
footer {
  margin-top: 55px;
  color: #89949d;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">AC</div>
  <h1>ALESSANDRO CASTELLESE</h1>
  <div class="subtitle">
    Giornalista sportivo<br>
    Tutti i miei canali ufficiali in un unico posto.
  </div>

  <a class="button"
     href="https://linktr.ee/castellese"
     target="_blank"
     rel="noopener">
    SCOPRI TUTTI I MIEI SOCIAL
  </a>

  <div class="note">
    Per aprire i social direttamente nelle rispettive
    applicazioni, puoi aprire questa pagina con Safari
    o con il browser esterno del tuo dispositivo.
  </div>

  <footer>© Alessandro Castellese</footer>
</div>
</body>
</html>
